<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Activities · Time Tracker</title>
		<meta
			name="description"
			content="Track time on tasks with pausable stopwatches and daily, weekly or monthly goals."
		/>
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='3' width='26' height='26' rx='6' fill='%2317151c'/><rect x='7' y='18' width='18' height='7' rx='2' fill='%23ffffff'/></svg>"
		/>
		<script src="js/theme.js"></script>
		<link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="css/styles.css" />
		<script defer src="js/time.js"></script>
		<script defer src="js/storage.js"></script>
		<script defer src="js/ui.js"></script>
		<script defer src="js/activities.js"></script>
	</head>
	<body data-page="activities">
		<a class="skip-link" href="#main">Skip to content</a>

		<div class="shell">
			<div class="rail">
				<header class="rail-head">
					<a class="brand" href="index.html"
						><span class="brand-mark" aria-hidden="true"></span>Time Tracker</a
					>
					<nav class="rail-nav" aria-label="Main">
						<ul class="nav-list">
							<li><a href="index.html" aria-current="page">Activities</a></li>
							<li><a href="analytics/index.html">Analytics</a></li>
							<li><a href="calendar/index.html">Calendar</a></li>
							<li><a href="settings/index.html">Settings</a></li>
						</ul>
					</nav>
				</header>
				<!-- Filled by ui.mountRail in js/ui.js. -->
				<aside class="rail-tasks" id="rail-tasks" aria-label="Tasks"></aside>
			</div>

			<div class="main-col">
				<div id="storage-warning" class="banner" role="status" hidden></div>

				<main id="main" class="stage">
					<h1 class="visually-hidden">Activities</h1>

					<section class="stage-view" id="stage-view" aria-labelledby="stage-name" hidden>
						<div id="stage-display">
							<div class="stage-meta">
								<p id="stage-status"></p>
								<p id="today-label"></p>
							</div>
							<div class="stage-head">
								<span class="task-square" aria-hidden="true"></span>
								<h2 class="stage-name" id="stage-name"></h2>
							</div>
							<p class="stage-schedule" id="stage-schedule"></p>
							<p class="stage-time" id="stage-time" role="timer"></p>
							<div id="stage-progress"></div>
							<div class="stage-goal">
								<p class="stage-goal-text" id="stage-goal"></p>
								<p class="stage-remaining" id="stage-remaining"></p>
							</div>
							<p class="stage-last" id="stage-last" hidden></p>
							<div class="stage-actions">
								<div class="btn-row" id="stage-actions">
									<button type="button" class="btn btn-stage" id="stage-toggle"></button>
									<button type="button" class="btn btn-quiet" id="stage-edit">Edit</button>
									<button type="button" class="btn btn-quiet btn-quiet-danger" id="stage-delete">
										Delete
									</button>
								</div>
								<div
									class="inline-confirm"
									id="stage-confirm"
									role="group"
									aria-label="Confirm delete"
									hidden
								>
									<p class="confirm-text" id="stage-confirm-text"></p>
									<div class="btn-row">
										<button type="button" class="btn btn-danger" id="confirm-delete">Delete</button>
										<button type="button" class="btn" id="cancel-delete">Cancel</button>
									</div>
								</div>
							</div>
						</div>
					</section>

					<section class="stage-add" id="stage-add" aria-labelledby="add-task-heading" hidden>
						<div class="stage-form-head">
							<h2 class="stage-form-title" id="add-task-heading">Add a task</h2>
							<p class="stage-form-intro" id="add-intro" hidden>
								Such as “Reading, 30 minutes a day” or “Guitar, 5 hours a week”. Then
								press <strong>Start</strong>.
							</p>
						</div>
						<form id="add-task-form" novalidate>
							<div class="form-grid">
								<div class="field field-name">
									<label for="new-task-name">Task name</label>
									<input
										id="new-task-name"
										name="name"
										type="text"
										maxlength="60"
										autocomplete="off"
										placeholder="e.g. Reading"
										required
										aria-describedby="new-task-name-error"
									/>
									<p class="field-error" id="new-task-name-error"></p>
								</div>
								<!-- Replaced by the schedule editor from js/activities.js, which the edit form also uses. -->
								<div id="new-task-schedule" class="field-schedule"></div>
								<fieldset class="field field-color">
									<legend>Color</legend>
									<div class="swatches" id="new-task-colors"></div>
								</fieldset>
								<div class="btn-row">
									<button type="submit" class="btn btn-primary">Add task</button>
									<button type="button" class="btn btn-quiet" id="cancel-add">Cancel</button>
								</div>
							</div>
						</form>
					</section>

					<p id="live-status" class="visually-hidden" role="status"></p>
				</main>
			</div>

			<footer class="site-footer" id="site-footer"></footer>
		</div>
	</body>
</html>
