<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Calendar · Time Tracker</title>
		<meta name="description" content="A week view of every tracked session." />
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='3' width='26' height='26' rx='6' fill='%2317151c'/><rect x='7' y='18' width='18' height='7' rx='2' fill='%23ffffff'/></svg>"
		/>
		<script src="../js/theme.js"></script>
		<link rel="preload" href="../fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="../fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="../css/styles.css" />
		<script defer src="../js/time.js"></script>
		<script defer src="../js/storage.js"></script>
		<script defer src="../js/ui.js"></script>
		<script defer src="../js/calendar.js"></script>
	</head>
	<body data-page="calendar">
		<a class="skip-link" href="#main">Skip to content</a>

		<div class="shell">
			<div class="rail">
				<header class="rail-head">
					<a class="brand" href="../index.html"
						><span class="brand-mark" aria-hidden="true"></span>Time Tracker</a
					>
					<nav class="rail-nav" aria-label="Main">
						<ul class="nav-list">
							<li><a href="../index.html">Activities</a></li>
							<li><a href="../analytics/index.html">Analytics</a></li>
							<li><a href="../calendar/index.html" aria-current="page">Calendar</a></li>
							<li><a href="../settings/index.html">Settings</a></li>
						</ul>
					</nav>
					<div class="now-chip" id="now-chip" hidden>
						<a class="now-chip-link" href="../index.html"
							><span class="now-chip-name"></span><span class="now-chip-time" role="timer"></span
						></a>
						<button type="button" class="now-chip-pause" aria-label="Pause">
							<svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z" /></svg>
						</button>
					</div>
				</header>
				<!-- Filled by ui.mountRail in js/ui.js. -->
				<aside class="rail-tasks" id="rail-tasks" aria-label="Tasks"></aside>
			</div>

			<div class="main-col">
				<div id="storage-warning" class="banner" role="status" hidden></div>

				<main id="main" class="page page-wide">
					<div class="cal-toolbar">
						<h1 class="page-title">Calendar</h1>
						<div class="cal-nav">
							<button
								type="button"
								class="btn btn-icon"
								id="prev-week"
								aria-label="Previous week"
							>
								<svg class="icon icon-chevron-left" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" /></svg>
							</button>
							<button type="button" class="btn" id="today-week">Today</button>
							<button
								type="button"
								class="btn btn-icon"
								id="next-week"
								aria-label="Next week"
							>
								<svg class="icon icon-chevron-right" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" /></svg>
							</button>
						</div>
						<h2 class="cal-range" id="week-label" aria-live="polite"></h2>
					</div>

					<p id="cal-empty" class="section-note" hidden>
						No tasks yet. Add one on the
						<a href="../index.html">Activities</a> page, and each tracked session
						will appear here as a block.
					</p>

					<div
						class="cal-scroll"
						id="cal-scroll"
						role="region"
						aria-label="Week of tracked sessions"
						tabindex="0"
					>
						<div class="cal-grid" id="cal-grid"></div>
					</div>
				</main>
			</div>

			<div class="cal-popover" id="cal-popover" aria-hidden="true" hidden></div>

			<footer class="site-footer" id="site-footer"></footer>
		</div>
	</body>
</html>
