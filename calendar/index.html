<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Calendar · Time Tracker</title>
		<meta name="description" content="A week view of every tracked session." />
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='17' r='13' fill='%232563eb'/><path d='M16 10v7l5 3' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/></svg>"
		/>
		<script src="../js/theme.js"></script>
		<link rel="stylesheet" href="../css/styles.css" />
		<script defer src="../js/time.js"></script>
		<script defer src="../js/storage.js"></script>
		<script defer src="../js/ui.js"></script>
		<script defer src="../js/calendar.js"></script>
	</head>
	<body>
		<a class="skip-link" href="#main">Skip to content</a>

		<header class="site-header">
			<div class="header-inner">
				<a class="brand" href="../index.html"
					><span class="brand-mark" aria-hidden="true"></span>Time Tracker</a
				>
				<nav aria-label="Main">
					<ul class="nav-list">
						<li><a href="../index.html">Activities</a></li>
						<li><a href="../analytics/index.html">Analytics</a></li>
						<li>
							<a href="../calendar/index.html" aria-current="page">Calendar</a>
						</li>
						<li><a href="../settings/index.html">Settings</a></li>
					</ul>
				</nav>
			</div>
		</header>

		<div id="storage-warning" class="banner" role="status" hidden></div>

		<main id="main" class="page page-wide">
			<div class="cal-toolbar">
				<h1 class="page-title">Calendar</h1>
				<div class="cal-nav">
					<button
						type="button"
						class="btn btn-icon"
						id="prev-week"
						aria-label="Previous week"
					>
						<span aria-hidden="true">◀</span>
					</button>
					<button type="button" class="btn" id="today-week">Today</button>
					<button
						type="button"
						class="btn btn-icon"
						id="next-week"
						aria-label="Next week"
					>
						<span aria-hidden="true">▶</span>
					</button>
				</div>
				<h2 class="cal-range" id="week-label" aria-live="polite"></h2>
			</div>

			<p id="cal-empty" class="section-note" hidden>
				No tasks yet. Add one on the
				<a href="../index.html">Activities</a> page, and each tracked session
				will appear here as a block.
			</p>

			<div
				class="cal-scroll"
				id="cal-scroll"
				role="region"
				aria-label="Week of tracked sessions"
				tabindex="0"
			>
				<div class="cal-grid" id="cal-grid"></div>
			</div>
		</main>

		<div class="cal-popover" id="cal-popover" aria-hidden="true" hidden></div>

		<footer class="site-footer" id="site-footer"></footer>
	</body>
</html>
